<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffb63e" />
  <title>ゲームをえらぶ｜放課後ゲーム部</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="games-page">
  <main class="site-shell games-shell">
    <header class="games-header">
      <a class="back-link" href="../">← トップへ</a>
      <div class="section-heading">
        <span class="eyebrow">GAME SELECT</span>
        <h1>ゲームをえらぶ</h1>
        <p>みんなで遊びたいゲームを選んでね。</p>
      </div>
    </header>

    <section class="games-section games-select-section" aria-label="ゲーム一覧">
      <article class="game-card">
        <div class="game-card-art">
          <img src="../nise_transfer_student_logo.png" alt="ニセ転校生を探せ！" />
        </div>
        <div class="game-card-body">
          <div class="game-meta">
            <span>4〜10人</span><span>約5〜10分</span><span>推理</span>
          </div>
          <h2>ニセ転校生を探せ！</h2>
          <p>クラスにまぎれたニセ転校生を、役職の情報と話し合いで見つけよう。</p>
          <a class="play-button" href="nise-transfer-student/">このゲームで遊ぶ</a>
        </div>
      </article>

      <div class="coming-soon" aria-label="今後ゲームを追加予定">
        <strong>次のゲームも制作予定</strong>
        <span>みんなで遊べるゲームを順番に追加していきます。</span>
      </div>
    </section>
  </main>
</body>
</html>
