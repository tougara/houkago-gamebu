<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffb63e" />
  <link rel="icon" type="image/png" href="houkago_gamebu_app_icon_logo_based.png" />
  <link rel="apple-touch-icon" href="houkago_gamebu_app_icon_logo_based.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="放課後ゲーム部" />
  <title>放課後ゲーム部｜スマホ1台でみんなで遊ぼう！</title>
  <link rel="stylesheet" href="player-editor.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body class="home-page">
  <main class="site-shell home-shell">
    <section class="hero" aria-labelledby="site-title">
      <div class="hero-overlay"></div>
      <div class="hero-inner">
        <div class="hero-logo-wrap">
          <img class="site-logo" src="houkago_gamebu_logo_transparent.png" alt="放課後ゲーム部 スマホ1台でみんなで遊ぼう！" onerror="this.style.display='none';document.getElementById('site-title').classList.remove('sr-only');" />
          <h1 id="site-title" class="sr-only">放課後ゲーム部</h1>
        </div>
        <div class="hero-action-wrap">
          <a class="primary-cta home-cta" href="games/">ゲームをえらぶ</a>
          <button class="home-member-btn" id="openPlayerRegistry" type="button">いつものメンバーを登録</button>
          <button class="home-settings-btn" type="button" data-hg-settings-open>⚙ 共通設定</button>
        </div>
      </div>
    </section>
  </main>
  <div class="player-registry-overlay" id="playerRegistryOverlay" hidden>
    <section class="player-registry-modal" role="dialog" aria-modal="true" aria-labelledby="registryTitle">
      <div class="player-registry-head">
        <div><span class="eyebrow">PLAYER REGISTRY</span><h2 id="registryTitle">いつものメンバー</h2><p>ここで登録した内容は、放課後ゲーム部の全ゲームで共通して使われます。</p></div>
        <button type="button" class="registry-close" id="closePlayerRegistry" aria-label="閉じる">×</button>
      </div>
      <div id="sharedPlayerEditorHost"></div>
    </section>
  </div>
  <script src="player-registry.js"></script>
  <script src="settings.js"></script>
  <script src="home.js"></script>
</body>
</html>
