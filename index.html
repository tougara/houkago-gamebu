<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffb63e" />
  <link rel="icon" type="image/png" href="houkago_gamebu_browser_icon_transparent.png" />
  <link rel="apple-touch-icon" href="houkago_gamebu_browser_icon_transparent.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="放課後ゲーム部" />
  <title>放課後ゲーム部｜スマホ1台でみんなで遊ぼう！</title>
  <link rel="stylesheet" href="player-editor.css?v=20261016-compact1" />
  <link rel="stylesheet" href="styles.css?v=20261014-homeflow" />
  <link rel="stylesheet" href="update-history.css?v=20261014-homeflow" />
  <link rel="stylesheet" href="settings.css?v=20261014-homeflow" />
  <link rel="stylesheet" href="resume.css?v=20261014-homeflow" />
</head>
<body class="home-page">
  <main class="site-shell home-shell">
    <section class="hero" aria-labelledby="site-title">
      <div class="hero-overlay"></div>
      <div class="hero-inner">
        <div class="hero-logo-wrap">
          <img class="site-logo" src="houkago_gamebu_logo_transparent.png" alt="放課後ゲーム部 スマホ1台でみんなで遊ぼう！" onerror="this.style.display='none';document.getElementById('site-title').classList.remove('sr-only');" />
          <h1 id="site-title" class="sr-only">放課後ゲーム部</h1>
        </div>
        <div class="hero-action-wrap">
          <div class="home-play-actions" aria-label="あそび方をえらぶ">
            <a class="primary-cta home-cta home-offline-cta" href="games/">オフラインで遊ぶ</a>
            <a class="primary-cta home-cta home-online-cta" href="online/">オンラインで遊ぶ</a>
          </div>
          <button class="home-member-btn" id="openPlayerRegistry" type="button">いつものメンバーを登録</button>
          <div class="home-tools-row">
            <button class="home-settings-btn" type="button" data-hg-settings-open>⚙ 共通設定</button>
            <button class="hg-history-home-btn" id="openUpdateHistory" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="homeUpdateHistoryOverlay">▤ 更新履歴</button>
          </div>
          <div class="hg-resume-slot" id="homeResumeSlot" hidden></div>
        </div>
      </div>
    </section>
  </main>
  <div class="player-registry-overlay" id="playerRegistryOverlay" hidden>
    <section class="player-registry-modal" role="dialog" aria-modal="true" aria-labelledby="registryTitle">
      <div class="player-registry-head">
        <div><span class="eyebrow">PLAYER REGISTRY</span><h2 id="registryTitle">いつものメンバー</h2><p>ここで登録した内容は、放課後ゲーム部の全ゲームで共通して使われます。</p></div>
        <button type="button" class="registry-close" id="closePlayerRegistry" aria-label="閉じる">×</button>
      </div>
      <div class="player-registry-tabs"><button type="button" class="player-registry-tab selected" data-registry-tab="members">メンバー</button><button type="button" class="player-registry-tab" data-registry-tab="records">プレイヤー記録</button></div>
      <div id="sharedPlayerEditorHost"></div>
    </section>
  </div>
  <div class="hg-history-overlay" id="homeUpdateHistoryOverlay" hidden>
    <section class="hg-history-modal" role="dialog" aria-modal="true" aria-labelledby="homeHistoryTitle">
      <header class="hg-history-head">
        <div><span class="hg-history-eyebrow">UPDATE HISTORY</span>
          <h2 id="homeHistoryTitle">放課後ゲーム部 更新履歴</h2>
          <p class="hg-history-subhead">サイト全体と8つのゲームの歩みを、制作当初から振り返れます。</p></div>
        <button class="hg-history-close" type="button" id="closeUpdateHistory" aria-label="更新履歴を閉じる">×</button>
      </header>
      <div class="hg-history-toolbar">
        <nav class="hg-history-filters" id="homeHistoryDates" aria-label="更新日で絞り込む"></nav>
        <nav class="hg-history-filters" id="homeHistoryCategories" aria-label="ゲーム・共通機能で絞り込む"></nav>
        <div class="hg-history-stats" id="homeHistorySummary" role="status"></div>
      </div>
      <div class="hg-history-scroll" id="homeHistoryScroll" tabindex="0">
        <p class="hg-history-intro">制作開始までさかのぼり、サイト全体の大切な変更をまとめました。新しい日付から表示し、同じ日付の更新は時刻順です。「大型更新」を強調しています。公開バージョン番号は付けていません。</p>
        <div class="hg-history-list" id="homeHistoryEntries"></div>
      </div>
    </section>
  </div>
  <script src="player-registry.js?v=20261016-compact1"></script>
  <script src="settings.js"></script>
  <script src="resume.js?v=20261019-exit1"></script>
  <script src="home.js"></script>
  <script src="changelog.js?v=20261016-nise-online-flow"></script>
  <script src="update-history.js"></script>
</body>
</html>
