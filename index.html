<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffb63e" />
  <title>放課後ゲーム部｜スマホ1台でみんなで遊ぼう！</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="site-shell">
    <section class="hero" aria-labelledby="site-title">
      <div class="hero-overlay"></div>
      <div class="hero-inner">
        <img class="site-logo" src="houkago_gamebu_logo.png" alt="放課後ゲーム部 スマホ1台でみんなで遊ぼう！" onerror="this.style.display='none';document.getElementById('site-title').classList.remove('sr-only');" />
        <h1 id="site-title" class="sr-only">放課後ゲーム部</h1>
        <p class="hero-copy">スマホ1台でみんなで遊ぼう！</p>
        <a class="primary-cta" href="#games">ゲームをえらぶ</a>
      </div>
    </section>

    <section id="games" class="games-section" aria-labelledby="games-title">
      <div class="section-heading">
        <span class="eyebrow">GAME LIST</span>
        <h2 id="games-title">あそべるゲーム</h2>
        <p>ひとつのスマホをみんなで囲んで遊べるゲームを、これから増やしていくよ。</p>
      </div>

      <article class="game-card">
        <div class="game-card-art">
          <img src="nise_transfer_student_logo.png" alt="ニセ転校生を探せ！" />
        </div>
        <div class="game-card-body">
          <div class="game-meta">
            <span>4〜10人</span><span>約5〜10分</span><span>推理</span>
          </div>
          <h3>ニセ転校生を探せ！</h3>
          <p>クラスにまぎれたニセ転校生を、役職の情報と話し合いで見つけよう。</p>
          <a class="play-button" href="games/nise-transfer-student/">このゲームで遊ぶ</a>
        </div>
      </article>

      <div class="coming-soon" aria-label="今後ゲームを追加予定">
        <strong>次のゲームも制作予定</strong>
        <span>みんなで遊べるゲームを順番に追加していきます。</span>
      </div>
    </section>
  </main>
</body>
</html>
