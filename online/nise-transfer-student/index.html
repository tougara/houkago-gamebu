<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#2b8ddd">
<title>ニセ転校生を探せ！ オンライン｜放課後ゲーム部</title>
<link rel="icon" href="../../houkago_gamebu_browser_icon_transparent.png">

</head>
<body>
<main id="app" class="game-app nise-online-app">
<nav class="top-nav hk-online-nav">
 <a class="back-home hk-online-link" href="../" id="return-lobby">← 部屋にもどる</a>
 <a class="back-home hk-online-link" href="../../games/" id="game-list-link">ゲームをえらぶ</a>
 <button type="button" class="nise-role-guide-open hk-online-link" id="role-guide-open" aria-haspopup="dialog" aria-controls="role-guide">役職一覧</button>
 <span class="online-connection hk-online-connection" id="connection">接続待ち</span>
</nav>
<div id="notice" class="online-message hk-online-notice" role="status" aria-live="polite" hidden></div>
<div id="game-root" aria-live="polite"><div class="card online-wait">オンラインルームに接続しています…</div></div>
</main>
<div class="nise-role-guide-overlay" id="role-guide" hidden>
 <section class="nise-role-guide-dialog" id="role-guide-dialog" role="dialog" aria-modal="true" aria-labelledby="role-guide-title" tabindex="-1">
  <header class="nise-role-guide-head">
   <h2 id="role-guide-title">役職一覧</h2>
   <button type="button" class="nise-role-guide-close" data-guide-close aria-label="役職一覧を閉じる">×</button>
  </header>
  <div class="nise-role-guide-content" id="role-guide-content"></div>
 </section>
</div>
