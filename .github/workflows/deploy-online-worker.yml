name: Deploy Online Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'tests/online-worker.test.mjs'
      - 'tests/online-nise.test.mjs'
      - 'tests/online-word-wolf.test.mjs'
      - 'tests/online-pita.test.mjs'
      - 'tests/online-meter.test.mjs'
      - 'tests/online-tower.test.mjs'
      - 'tests/online-link.test.mjs'
      - '.github/workflows/deploy-online-worker.yml'

permissions:
  contents: read

concurrency:
  group: online-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Run server tests
        working-directory: worker
        run: npm test
      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets first."
            exit 1
          fi
      - name: Deploy Cloudflare Worker
        working-directory: worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Cloudflare's API tokens are one-line values. A pasted trailing
          # newline makes the Authorization header invalid in Wrangler.
          # Normalize without printing either secret into the action logs.
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare API token or account ID is blank after trimming whitespace."
            exit 1
          fi
          npx wrangler deploy --config wrangler.jsonc
